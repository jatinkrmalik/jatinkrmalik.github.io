<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Kylo is a friendly dog. Please don't chase him. Call or text his owner.">
<title>You've found Kylo</title>
<link rel="preload" href="avatar.gif" as="image">
<style>
  :root {
    --bg: #f4efe6;
    --glow: #f8e2c4;
    --ink: #231c17;
    --muted: #564c43;
    --note: #3c322b;
    --line: rgba(48, 32, 16, 0.12);
    --call: #241c17;
    --call-ink: #f7f3ee;
    --call-meta: #e4d9cc;
    --call-press: #3a3028;
    --ghost: transparent;
    --ghost-ink: #241c17;
    --ghost-line: rgba(36, 28, 23, 0.28);
    --ghost-press: rgba(36, 28, 23, 0.06);
    --frame: #fffcf8;
    --frame-edge: rgba(70, 44, 16, 0.14);
    --shadow: rgba(62, 36, 12, 0.38);
    --chip: rgba(36, 28, 23, 0.06);
    --foot: #6a5d51;
    --focus: #241c17;
    --portrait-bg: #cfc6ba;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131210;
      --glow: rgba(176, 112, 52, 0.2);
      --ink: #f6f1ea;
      --muted: #c9b8a6;
      --note: #eadfd2;
      --line: rgba(246, 232, 214, 0.14);
      --call: #f3ece3;
      --call-ink: #231c17;
      --call-meta: #53483e;
      --call-press: #e4d9cc;
      --ghost: transparent;
      --ghost-ink: #f6f1ea;
      --ghost-line: rgba(246, 236, 224, 0.34);
      --ghost-press: rgba(246, 236, 224, 0.08);
      --frame: #221e1a;
      --frame-edge: rgba(255, 232, 206, 0.16);
      --shadow: rgba(0, 0, 0, 0.55);
      --chip: rgba(246, 236, 224, 0.08);
      --foot: #b7a79a;
      --focus: #f3ece3;
      --portrait-bg: #3a342c;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }

  html {
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background-color: var(--bg);
    background-image: radial-gradient(32rem 20rem at 50% -1rem, var(--glow), transparent 62%);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection {
    background: rgba(168, 116, 58, 0.28);
    color: inherit;
  }

  main {
    width: min(100%, 28rem);
    margin: 0 auto;
    padding: 1.35rem 1.25rem 2rem;
    padding-top: calc(env(safe-area-inset-top, 0px) + 1.35rem);
    padding-right: calc(env(safe-area-inset-right, 0px) + 1.25rem);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 2rem);
    padding-left: calc(env(safe-area-inset-left, 0px) + 1.25rem);
  }

  .portrait {
    width: 11.5rem;
    height: 11.5rem;
    margin: 0.15rem auto 1.15rem;
    padding: 0.32rem;
    border-radius: 50%;
    background: var(--frame);
    box-shadow:
      0 0 0 1px var(--frame-edge),
      0 18px 34px -16px var(--shadow);
  }

  .portrait img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    background: var(--portrait-bg);
  }

  h1 {
    margin: 0;
    font-family: Baskerville, "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, "Liberation Serif", "Times New Roman", serif;
    font-weight: 500;
    font-size: clamp(2.2rem, 9.4vw, 3.05rem);
    line-height: 1.02;
    letter-spacing: -0.025em;
    text-align: center;
    text-wrap: balance;
  }

  h1 .name {
    font-style: italic;
    font-weight: 500;
  }

  .note {
    margin: 0.75rem 0 0;
    text-align: center;
    font-size: 1.0625rem;
    font-weight: 500;
    line-height: 1.35;
    color: var(--note);
  }

  .actions {
    display: grid;
    gap: 0.65rem;
    margin-top: 1.5rem;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 3.5rem;
    padding: 0.85rem 1.1rem;
    border-radius: 1rem;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    cursor: pointer;
  }

  .btn-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
  }

  .btn svg {
    display: block;
    width: 1.4rem;
    height: 1.4rem;
    flex: none;
  }

  .btn .copy { text-align: left; }

  .btn .t {
    display: block;
    font-size: 1.125rem;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.15;
  }

  .btn .n {
    display: block;
    margin-top: 0.2rem;
    font-size: 1.02rem;
    font-weight: 500;
    letter-spacing: 0.012em;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .btn-call {
    min-height: 4.25rem;
    background: var(--call);
    color: var(--call-ink);
    box-shadow: 0 12px 22px -14px var(--shadow);
  }

  .btn-call .n { color: var(--call-meta); }

  .btn-text {
    background: var(--ghost);
    color: var(--ghost-ink);
    box-shadow: inset 0 0 0 1.5px var(--ghost-line);
  }

  .btn-call:active { background: var(--call-press); }
  .btn-text:active { background: var(--ghost-press); }

  .btn:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  @media (hover: hover) {
    .btn-call:hover { background: var(--call-press); }
    .btn-text:hover { background: var(--ghost-press); }
  }

  .facts {
    margin: 1.55rem 0 0;
    padding: 0;
  }

  .facts div {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.35rem 1rem;
    flex-wrap: wrap;
    padding: 0.78rem 0.1rem;
    border-top: 1px solid var(--line);
  }

  .facts dt {
    margin: 0;
    font-size: 0.98rem;
    font-weight: 500;
    color: var(--muted);
  }

  .facts dd {
    margin: 0;
    font-size: 0.98rem;
    font-weight: 600;
    letter-spacing: -0.011em;
    text-align: right;
  }

  .facts .chip {
    font-family: ui-monospace, "SF Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
    font-weight: 500;
    font-size: 0.92rem;
    letter-spacing: 0.03em;
    white-space: nowrap;
    margin-left: auto;
    user-select: all;
    -webkit-user-select: all;
    background: var(--chip);
    padding: 0.18rem 0.4rem;
    border-radius: 0.4rem;
  }

  .foot {
    margin: 1.35rem 0 0;
    text-align: center;
    font-size: 0.8rem;
    letter-spacing: 0.01em;
    color: var(--foot);
  }

  @media (min-width: 720px) {
    main { padding-top: 4.25rem; }
  }

  @media (max-height: 520px) {
    .portrait {
      width: 7.25rem;
      height: 7.25rem;
      margin-bottom: 0.65rem;
    }
    h1 { font-size: 1.9rem; }
    .note { margin-top: 0.35rem; }
    .actions { margin-top: 0.85rem; }
    main {
      padding-top: calc(env(safe-area-inset-top, 0px) + 0.7rem);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn:active { transform: none; }
  }

  @media (forced-colors: active) {
    .btn { border: 2px solid ButtonText; }
    .portrait { border: 1px solid ButtonText; }
  }
</style>
</head>
<body>
<main>
  <div class="portrait">
    <img src="avatar.gif" alt="Photo of Kylo" width="384" height="384" fetchpriority="high" decoding="async">
  </div>
  <h1>You&rsquo;ve found <span class="name">Kylo</span>.</h1>
  <p class="note">Please don&rsquo;t chase him.<br>He&rsquo;s friendly.</p>
  <div class="actions">
    <a class="btn btn-call" href="tel:+17738008636">
      <span class="btn-inner">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span class="copy">
          <span class="t">Call his owner</span>
          <span class="n">(773) 800-8636</span>
        </span>
      </span>
    </a>
    <a class="btn btn-text" href="sms:+17738008636">
      <span class="btn-inner">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="copy">
          <span class="t">Text his owner</span>
        </span>
      </span>
    </a>
  </div>
  <dl class="facts">
    <div>
      <dt>Sex</dt>
      <dd>Male</dd>
    </div>
    <div>
      <dt>Breed</dt>
      <dd>Golden Retriever mix</dd>
    </div>
    <div>
      <dt>Weight</dt>
      <dd>About 85 pounds</dd>
    </div>
    <div>
      <dt>Microchip</dt>
      <dd class="chip">982091064699716</dd>
    </div>
  </dl>
  <p class="foot">Thanks for checking his tag.</p>
</main>
</body>
</html>
